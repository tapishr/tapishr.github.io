<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tapish Rathore | Writing</title>
	<link rel="shortcut icon" href="../images/favicon.ico">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="../layout.css" />
	<link rel="stylesheet" href="../styles.css" />
	<link rel="stylesheet" href="blog_layout.css" />
	<link rel="stylesheet" href="article_styles.css" />
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script src="blog.js"></script>
	<script src="article.js"></script>
</head>

<body>
	<nav>
		<a class="logo" href="/">
			<span class="monogram">TR</span>
			Tapish Rathore
		</a>
		<div class="hamburger-menu" onclick="toggleMenu()">
			<i class="fas fa-bars"></i>
		</div>
		<div class="nav-menu">
			<a href="/projects/" class="nav-btn">Projects</a>
			<a href="/blog" class="nav-btn">Blog</a>
			<button class="say-hello-btn" onclick="openContactModal()">Say Hello</button>
		</div>
	</nav>

	<main class="container">
		<aside id="menu">
			<ul>
				<li data-category="tech">Technology</li>
				<li data-category="entrepreneurship">Entrepreneurship</li>
				<li data-category="all">All Articles</li>
			</ul>
		</aside>
		<section id="content">
			<!-- populated from list_pages/ by blog.js -->
		</section>
	</main>

	<div id="contact-modal" class="contact-modal">
		<div class="contact-form-container">
			<span class="close-icon" onclick="closeContactModal()">&times;</span>
			<h2>Get in Touch</h2>
			<form class="contact-form" action="mailto:tapish303@gmail.com" method="post" enctype="text/plain">
				<input type="text" name="name" placeholder="Your Name" required>
				<input type="email" name="email" placeholder="Your Email" required>
				<textarea name="message" placeholder="Your Message" rows="5" required></textarea>
				<button type="submit">Send Message</button>
			</form>
		</div>
	</div>

	<footer class="footer">
		<div class="footer-logo">
			<span class="monogram">TR</span><br />
			Tapish Rathore
		</div>
		<p>Innovating at the intersection of technology and social impact</p>
		<div class="footer-social">
			<a href="https://github.com/tapishr" aria-label="GitHub"><i class="fab fa-github"></i></a>
			<a href="https://www.linkedin.com/in/tapishr" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
			<a href="mailto:tapish303@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
		</div>
		<a href="/archive" class="archive"><i class="fas fa-archive"></i>archive</a>
	</footer>
</body>

</html>
